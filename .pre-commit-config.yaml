default_stages: [pre-commit]
default_install_hook_types:
  [pre-commit, prepare-commit-msg, commit-msg, post-commit, pre-push]

ci:
  skip:
    - mirror-check
    - no-commit-to-branch

repos:
  - repo: https://github.com/George-Ogden/mirror-rorrim/
    rev: v0.4.10
    hooks:
      - id: mirror-check
        fail_fast: true

  - repo: builtin
    hooks:
      - id: no-commit-to-branch
        fail_fast: true
        args: [-b, m]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
        args: [--assume-in-merge]

  - repo: https://github.com/semgrep/pre-commit/
    rev: v1.179.0
    hooks:
      - id: semgrep
        require_serial: true
        args:
          [
            --config,
            .semgrep-rules/python.yaml,
            --autofix,
            --quiet,
            --error,
            --skip-unknown-extensions,
            --disable-version-check,
          ]

  - repo: https://github.com/pre-commit/pre-commit-hooks/
    rev: v6.0.0
    hooks:
      - id: requirements-txt-fixer

  - repo: https://github.com/George-Ogden/linter/
    rev: v2.1.1
    hooks:
      - id: lint
        exclude: ^tests/[^/]*/test_data/
        args: [--fix]

  - repo: https://github.com/scop/pre-commit-shfmt/
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        stages: [pre-commit]

  - repo: https://github.com/scop/pre-commit-shfmt/
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        stages: [pre-commit]

  - repo: https://github.com/koalaman/shellcheck-precommit/
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/semgrep/pre-commit/
    rev: v1.178.0
    hooks:
      - id: semgrep
        require_serial: true
        args:
          [
            --config,
            .semgrep-rules/pre-commit.yaml,
            --autofix,
            --quiet,
            --error,
            --skip-unknown-extensions,
            --disable-version-check,
          ]

  - repo: https://github.com/astral-sh/ruff-pre-commit/
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^tests/[^/]*/test_data/
      - id: ruff-format
        exclude: ^tests/[^/]*/test_data/
        args: [--config, format.skip-magic-trailing-comma = true]

  - repo: https://github.com/rbubley/mirrors-prettier/
    rev: v3.9.9
    hooks:
      - id: prettier
        exclude: ^tests/[^/]*/test_data/

  - repo: https://github.com/rhysd/actionlint/
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/codespell-project/codespell/
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: tests/spell-check/
        args:
          - -f
          - --regex
          # Copied from https://github.com/codespell-project/codespell/issues/2730#issuecomment-1657006554.
          - |
            (?<![a-zà-öø-ÿ])[a-zà-öø-ÿ'`]+|[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ'`]*|[a-zà-öø-ÿ]+'[a-zà-öø-ÿ]*|[a-zà-öø-ÿ]+(?=[_-])|[a-zà-öø-ÿ]+(?=[A-ZÀ-ÖØ-Þ])|\d+

  - repo: https://github.com/George-Ogden/pre-commit-hooks/
    rev: v4.1.1
    hooks:
      - id: dbg-check
        exclude: (?x)^(
          tests/dbg-check/.*|
          validate-dbg.sh
          )$
      - id: todo-check
        exclude: (?x)^(
          README.md|
          \.pre-commit-hooks\.yaml|
          tests/[^/]*/.*|
          validate-todo.sh|
          \.pre-commit-config\.yaml|
          \.gitignore
          )$
      - id: mypy
        exclude: ^tests/[^/]*/test_data/
        args: [-r, requirements-dev.txt, --show-traceback]
      - id: spell-check-commit-msgs
      - id: mirror-auto-msg
      - id: version-txt-auto-msg
      - id: list-untracked-files
