name: Run Python Tests

on:
  push:
    branches:
      - m
  pull_request:
    branches:
      - m

jobs:
  run-pytest:
    uses: George-Ogden/actions/.github/workflows/python-test.yaml@v5.2.1
    with:
      python-versions: "['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']"
      package-resolution: lowest-direct
