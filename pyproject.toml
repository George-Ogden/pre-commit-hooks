[project]
name = "Pre-Commit-Hooks"
requires-python = ">=3.11,<3.16"
authors = [{ name = "George Ogden" }]
license-files = ["LICENSE"]
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "mirror-rorrim ; python_full_version >= '3.12'",
  "py-spy",
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "types" },
]
test = [
  "gitpython",
  "inline-snapshot",
  "pre-commit",
  "pytest>=9.0.0",
  "pytest-dbg ; python_full_version >= '3.11'",
  "pytest-timeout",
  "pytest-xdist",
  "wcwidth",
  { include-group = "utils" },
]
lint = [
  "linter==2.1.3",
  "prek",
  "ruff==0.17.2",
  "semgrep==1.181.1",
]
types = [
  "mypy",
  "mypy-pytest-plugin ; python_full_version >= '3.12'",
  { include-group = "test" },
]
utils = [
  "extra-type-helpers ; python_full_version >= '3.12'",
  "georges-utils ; python_full_version >= '3.12'",
]
docs = [
  "mkdocs<2",
  "mkdocs-material",
  "mkdocstrings",
]

[tool.uv.sources]
extra-type-helpers = { git = "https://github.com/George-Ogden/extra-types" }
georges-utils = { git = "https://github.com/George-Ogden/utils" }
linter = { git = "https://github.com/George-Ogden/linter/" }
mirror-rorrim = { git = "https://github.com/George-Ogden/mirror-rorrim" }
mypy-pytest-plugin = { git = "https://github.com/George-Ogden/mypy-pytest" }
pytest-dbg = { git = "https://github.com/George-Ogden/pytest-dbg" }

[tool.setuptools.dynamic]
version = { file = ["version.txt"] }

[tool.setuptools]
packages = []
script-files = ["./run-spell-check.sh"]
